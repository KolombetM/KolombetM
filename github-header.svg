<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Mykola — Full-Stack Software Developer</title>
  <desc id="desc">Terminal-style GitHub profile header.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07100b"/>
      <stop offset="100%" stop-color="#0d1712"/>
    </linearGradient>

    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff88"/>
      <stop offset="100%" stop-color="#8affb5"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#39ff88" flood-opacity=".18"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#39ff88" opacity=".035"/>
    </pattern>

    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff88" stop-opacity=".16"/>
      <stop offset="70%" stop-color="#39ff88" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#39ff88" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="500" rx="28" fill="#030604"/>
  <rect x="20" y="20" width="1560" height="460" rx="24" fill="url(#bg)" stroke="#39ff88" stroke-width="1.5"/>
  <rect x="20" y="20" width="1560" height="460" rx="24" fill="url(#scanlines)"/>

  <!-- Terminal title bar -->
  <line x1="20" y1="82" x2="1580" y2="82" stroke="#39ff88" stroke-opacity=".35"/>
  <circle cx="62" cy="51" r="10" fill="#ff5f56"/>
  <circle cx="94" cy="51" r="10" fill="#ffbd2e"/>
  <circle cx="126" cy="51" r="10" fill="#27c93f"/>

  <text x="165" y="59"
        fill="#8affb5"
        font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="21">mykola@github:~</text>

  <!-- Main content -->
  <text x="72" y="128"
        fill="#39ff88"
        font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="19">$ whoami</text>

  <text x="72" y="190"
        fill="url(#glow)"
        filter="url(#shadow)"
        font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="58"
        font-weight="700">Hello, I'm Mykola</text>

  <text x="72" y="232"
        fill="#39ff88"
        font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="19">$ role</text>

  <text x="72" y="267"
        fill="#f2f7f4"
        font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="24">Full-Stack Software Developer</text>

  <text x="72" y="301"
        fill="#9bb3a5"
        font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="17">Building reliable software and clean user experiences.</text>

  <!-- Stack -->
  <text x="72" y="343"
        fill="#39ff88"
        font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="19">$ stack</text>

  <!-- EDIT THIS LIST -->
  <text x="72" y="377"
        fill="#dce8e0"
        font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="17">React  ·  Next.js  ·  TypeScript  ·  Node.js  ·  Python</text>

  <text x="72" y="407"
        fill="#dce8e0"
        font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="17">PostgreSQL  ·  Redis  ·  Kafka  ·  AWS  ·  Docker</text>

  <!-- Decorative orb -->
  <circle cx="1350" cy="274" r="190" fill="url(#orb)"/>

  <!-- Globe -->
  <g transform="translate(1350 274)" fill="none" stroke="#39ff88" stroke-opacity=".7">
    <ellipse rx="145" ry="145" stroke-width="1.2"/>
    <ellipse rx="145" ry="55" stroke-width="1"/>
    <ellipse rx="145" ry="105" stroke-width="1"/>
    <ellipse rx="55" ry="145" stroke-width="1"/>
    <ellipse rx="105" ry="145" stroke-width="1"/>
    <path d="M-145 0H145" stroke-width="1"/>
    <path d="M0-145V145" stroke-width="1"/>
  </g>

  <g fill="#39ff88" opacity=".7">
    <circle cx="1215" cy="192" r="2"/>
    <circle cx="1450" cy="155" r="2"/>
    <circle cx="1492" cy="302" r="2"/>
    <circle cx="1180" cy="345" r="2"/>
    <circle cx="1390" cy="426" r="2"/>
  </g>

  <!-- Cursor -->
  <text x="72" y="445"
        fill="#39ff88"
        font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
        font-size="19">$</text>
  <rect x="93" y="429" width="11" height="21" rx="1" fill="#39ff88" opacity=".9"/>

  <!-- Footer -->
  <line x1="20" y1="445" x2="1580" y2="445"
      stroke="#39ff88" stroke-opacity=".35"/>

  <text x="50" y="473"
      fill="#79a88c"
      font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
      font-size="14">
      &gt; focus  &gt; code  &gt; improve  &gt; repeat
  </text>
</svg>
